<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iran's Victory</title>
    <style>
        :root {
            --israel-blue: #0038b8;
            --iran-green: #239f40;
            --iran-red: #da0000;
            --gold: #FFD700;
        }

        body {
            margin: 0; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; font-family: 'Arial Black', sans-serif;
        }

        .stage {
            width: 1100px; height: 650px; position: relative;
            background: radial-gradient(circle at center, #151515 0%, #000 100%);
            border: 8px solid #222; overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        /* FLAG CORE */
        .flag {
            width: 300px; height: 200px; position: absolute; top: 225px;
            display: flex; justify-content: center; align-items: center;
            z-index: 10; transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }

        .israel { left: 80px; background: white; border-top: 30px solid var(--israel-blue); border-bottom: 30px solid var(--israel-blue); box-sizing: border-box; }
        .iran { right: 80px; display: flex; flex-direction: column; }

        .ir-g { background: var(--iran-green); flex: 1; width: 100%; }
        .ir-w { background: #fff; flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; }
        .ir-r { background: var(--iran-red); flex: 1; width: 100%; }

        .symbol { font-size: 90px; position: absolute; z-index: 25; filter: drop-shadow(0 0 8px rgba(0,0,0,0.3)); }
        .star { color: var(--israel-blue); }
        .emblem { color: var(--iran-red); transition: all 0.4s ease; }

        /* CINEMATIC UI */
        #startText {
            position: absolute; width: 100%; text-align: center; top: 35%;
            font-size: 180px; color: #fff; z-index: 1000;
            text-shadow: 0 0 20px cyan, 0 0 60px blue;
            animation: startZoom 1.5s forwards;
        }

        .victory-banner {
            position: absolute; top: 60px; width: 100%;
            text-align: center; color: var(--gold); font-size: 150px;
            z-index: 500; opacity: 0; transform: scale(0.5);
            text-shadow: 0 0 40px orange, 0 0 80px red;
        }

        /* VFX SYSTEMS */
        .impact-ring {
            position: absolute; border: 12px solid white; border-radius: 50%;
            width: 20px; height: 20px; transform: translate(-50%, -50%) scale(0);
            z-index: 50; opacity: 0; animation: expandRing 0.6s forwards;
        }

        .orange-nova {
            position: absolute; width: 350px; height: 350px;
            background: radial-gradient(circle, #fff 0%, #ff4500 50%, transparent 70%);
            border-radius: 50%; z-index: 200; transform: translate(-50%, -50%) scale(0);
            animation: novaAction 1.2s forwards;
        }

        .missile {
            position: absolute; height: 16px; width: 85px;
            background: linear-gradient(90deg, transparent, #ff4500, #fff);
            border-radius: 10px; z-index: 100; box-shadow: 0 0 20px #ff4500;
        }

        .particle { position: absolute; pointer-events: none; z-index: 450; border-radius: 50%; }

        @keyframes startZoom {
            0% { transform: scale(0); opacity: 0; filter: blur(10px); }
            40% { transform: scale(1.2); opacity: 1; filter: blur(0); }
            100% { transform: scale(6); opacity: 0; }
        }

        @keyframes expandRing {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(45); opacity: 0; }
        }

        @keyframes novaAction {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            20% { transform: translate(-50%, -50%) scale(12); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(30); opacity: 0; }
        }

        .shake { animation: intenseShake 0.1s infinite; }
        @keyframes intenseShake {
            0% { transform: translate(15px, 10px); }
            50% { transform: translate(-15px, -10px); }
            100% { transform: translate(15px, -10px); }
        }
    </style>
</head>
<body>
    <div class="stage" id="viewport">
        <div id="startText">START!</div>
        <div class="victory-banner" id="victoryText" style="color:gold;" >Victory!</div>
        
        <div class="flag israel" id="israelFlag"><div class="symbol star">✡</div></div>
        <div class="flag iran" id="iranFlag">
            <div class="ir-g"></div>
            <div class="ir-w"><div class="symbol emblem" id="emblem">☫</div></div>
            <div class="ir-r"></div>
        </div>
    </div>

    <script>
        const vp = document.getElementById('viewport');
        const israel = document.getElementById('israelFlag');
        const iran = document.getElementById('iranFlag');
        const emblem = document.getElementById('emblem');
        const victory = document.getElementById('victoryText');

        function camShake(time) {
            vp.classList.add('shake');
            setTimeout(() => vp.classList.remove('shake'), time);
        }

        function spawnImpact(x, y) {
            const r = document.createElement('div');
            r.className = 'impact-ring';
            r.style.left = x + 'px'; r.style.top = y + 'px';
            vp.appendChild(r);
            setTimeout(() => r.remove(), 600);
        }

        function fireMissile(isLast) {
            const m = document.createElement('div');
            m.className = 'missile';
            m.style.right = '400px'; 
            m.style.top = (250 + Math.random() * 150) + 'px';
            vp.appendChild(m);
            
            let pos = 400;
            const flight = setInterval(() => {
                pos += 60;
                m.style.right = pos + 'px';
                if (pos > 900) {
                    clearInterval(flight);
                    m.remove();
                    if(isLast) {
                        camShake(1200);
                        const n = document.createElement('div');
                        n.className = 'orange-nova';
                        n.style.left = '230px'; n.style.top = '325px';
                        vp.appendChild(n);
                        israel.style.transform = 'translate(-800px, 400px) rotate(-720deg) scale(0)';
                        israel.style.opacity = '0';
                    } else {
                        camShake(120);
                        spawnImpact(230, 325);
                    }
                }
            }, 10);
        }

        function spawnConfetti() {
            setInterval(() => {
                const x = Math.random() * 1100, y = Math.random() * 650;
                const hue = Math.random() * 360;
                for(let i=0; i<65; i++){
                    const p = document.createElement('div');
                    p.className = 'particle';
                    p.style.backgroundColor = `hsl(${hue}, 100%, 60%)`;
                    p.style.left = x + 'px'; p.style.top = y + 'px';
                    p.style.width = Math.random() * 15 + 'px';
                    p.style.height = p.style.width;
                    p.style.boxShadow = `0 0 20px hsl(${hue}, 100%, 60%)`;
                    const ang = Math.random()*Math.PI*2, vel = Math.random()*25+10;
                    const vx = Math.cos(ang)*vel, vy = Math.sin(ang)*vel;
                    let o = 1;
                    const move = setInterval(() => {
                        p.style.left = (parseFloat(p.style.left)+vx)+'px';
                        p.style.top = (parseFloat(p.style.top)+vy)+'px';
                        o-=0.02; p.style.opacity = o;
                        if(o<=0){ clearInterval(move); p.remove(); }
                    }, 16);
                    vp.appendChild(p);
                }
            }, 200);
        }

        // --- THE SCRIPTED CHOREOGRAPHY ---

        // 1. Israel Attacks First (Aggressive Lunge)
        setTimeout(() => { 
            israel.style.transform = 'translateX(550px) scale(1.1) rotate(10deg)'; 
        }, 2000);
        setTimeout(() => { 
            spawnImpact(750, 325); camShake(400); 
            israel.style.transform = 'translateX(0) rotate(0deg)'; 
        }, 2600);

        // 2. Iran Counter-Attacks
        setTimeout(() => { 
            iran.style.transform = 'translateX(-550px) scale(1.1) rotate(-10deg)'; 
        }, 3800);
        setTimeout(() => { 
            spawnImpact(350, 325); camShake(500); 
            iran.style.transform = 'translateX(0) rotate(0deg)'; 
        }, 4400);

        // 3. The Grand Standoff (Both Clash at Center)
        setTimeout(() => {
            israel.style.transform = 'translateX(150px)';
            iran.style.transform = 'translateX(-150px)'; 
        }, 6000);

        setTimeout(() => {
            spawnImpact(550, 325); camShake(1000);
            emblem.style.transform = 'scale(4.5)'; emblem.style.color = 'white';
            
            // Recoil with high speed
            setTimeout(() => {
                israel.style.transform = 'translateX(-20px)';
                iran.style.transform = 'translateX(20px)';
                emblem.style.transform = 'scale(1)'; emblem.style.color = 'var(--iran-red)';
            }, 500);
        }, 6800);
		
        // 4. Iran Missile Storm
        setTimeout(() => {
            let c = 0; const total = 45;
            const barrage = setInterval(() => {
                c++; fireMissile(c === total);
                if(c >= total) clearInterval(barrage);
            }, 50);
        }, 8500);

        // 5. THE ULTIMATE VICTORY GLIDE
        setTimeout(() => {
            // Smoothly move from home right (80px) to absolute center with scale
            // Center is 550px. 550 - 300(half) - 80(offset) = approx -320px slide
            iran.style.transition = 'all 1.5s cubic-bezier(0.19, 1, 0.22, 1)';
            iran.style.transform = 'translateX(-320px) scale(3.8)';
            
            victory.style.opacity = '1';
            victory.style.transform = 'scale(1)';
            spawnConfetti();
        }, 13000);

    </script>
</body>
</html>
